# Home Assistant automation: the buttons on any light control the whole group,
# while individual control from Home Assistant keeps working.
#
# How it works: every light runs its own buttons locally (presets, dimming,
# colour sweep). Whenever a light's state changes within two seconds of one
# of ITS OWN buttons firing an event, or while one of its buttons is held,
# that state is copied to the other members of the group. State changes that
# did not come from a button (the Home Assistant UI, other automations, the
# group helper) are not copied, so individual control is untouched.
#
# Setup:
#   1. Replace the entity IDs under `triggers:` with your lights (the same
#      ones that are members of the group helper).
#   2. The event entities are found by convention from the light's entity
#      ID: light.kitchen_undercab_desk_l -> event.kitchen_undercab_desk_l_power_button
#      and ..._color_button. If you have renamed entities, adjust `src_name`.
#   3. Create it in Settings -> Automations -> Create -> Edit in YAML.
#
# Needs firmware with the `long_release` event (package from 2026-11-14 on).

alias: Under cabinet lights - buttons control the group
description: >-
  A light's state is copied to the rest of light.under_cabinet_lights_helper
  when the change was caused by that light's own buttons.
mode: restart
triggers:
  - trigger: state
    entity_id:
      - light.kitchen_undercab_desk_l
      - light.kitchen_undercab_desk_r
      # ... list all nine lights
conditions:
  - condition: template
    value_template: >-
      {% set src_name = trigger.entity_id.split('.')[1] %}
      {% set ns = namespace(open=false) %}
      {% for suffix in ['_power_button', '_color_button'] %}
        {% set e = states.event[src_name ~ suffix] %}
        {% if e is not none %}
          {% set age = (now() - e.last_changed).total_seconds() %}
          {% if e.attributes.event_type == 'long_press' or age < 2 %}
            {% set ns.open = true %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.open }}
actions:
  # Dimming and the colour sweep update the light many times a second;
  # restart mode plus this short delay collapses them into a few updates.
  - delay:
      milliseconds: 150
  - variables:
      group: light.under_cabinet_lights_helper
      others: >-
        {{ (state_attr(group, 'entity_id') or [])
           | reject('eq', trigger.entity_id) | list }}
      src: "{{ states[trigger.entity_id] }}"
  - if:
      - condition: template
        value_template: "{{ others | count == 0 }}"
    then:
      - stop: "No other group members"
  - if:
      - condition: template
        value_template: "{{ src.state == 'off' }}"
    then:
      - action: light.turn_off
        target:
          entity_id: "{{ others }}"
        data:
          transition: 0.3
    else:
      - action: light.turn_on
        target:
          entity_id: "{{ others }}"
        data:
          transition: 0.3
          brightness: "{{ src.attributes.brightness }}"
          rgbww_color: "{{ src.attributes.rgbww_color }}"
